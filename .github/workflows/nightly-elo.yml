name: Nightly Elo + projections refresh

# Runs nightly to keep the groups page and title projections current:
#   1. pull newly-played international results (martj42, via Can-Tre-Beat-Vegas)
#   2. recalculate the custom Elo ratings with that repo's engine
#   3. sync the ratings + completed WC results into this repo's data files
#   4. commit the refreshed data
#
# The committed data is then consumed by the deployed app: the Vercel cron
# `/worldcup/api/cron/predictions` (scheduled just after this job in
# vercel.json) applies the new results to Match rows and recomputes the Elo
# Monte Carlo projections. This keeps a single Elo implementation
# (Can-Tre-Beat-Vegas/soccer/model/elo.py) behind both projects.
#
# No extra secrets needed: Can-Tre-Beat-Vegas is a public repo, so the default
# GITHUB_TOKEN checks it out, and `permissions: contents: write` lets this job
# commit the refreshed data back to this repo.

on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC nightly (ahead of the 08:00 predictions cron)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out World_Cup_Tickets
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check out Can-Tre-Beat-Vegas (Elo engine + results)
        uses: actions/checkout@v4
        with:
          repository: Hijodeagua/Can-Tre-Beat-Vegas
          path: Can-Tre-Beat-Vegas

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Recalculate Elo from latest results
        working-directory: Can-Tre-Beat-Vegas
        run: |
          python -m pip install --quiet pandas requests
          # Best effort: pull newly-played games. Don't fail the job if offline.
          python -m soccer.data.fetch_results || echo "results fetch skipped"
          python -m soccer.model.export_ratings

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm ci

      - name: Sync ratings + results into data files
        env:
          ELO_RATINGS_PATH: ${{ github.workspace }}/Can-Tre-Beat-Vegas/soccer/model/artifacts/elo_ratings.json
          RESULTS_CSV_PATH: ${{ github.workspace }}/Can-Tre-Beat-Vegas/soccer/data/results.csv
        run: |
          npm run sync-elo
          npm run sync-results

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/elo-ratings.json data/results-2026.json
          if git diff --cached --quiet; then
            echo "No rating/result changes."
          else
            git commit -m "chore: nightly Elo ratings + WC results refresh"
            git push origin HEAD:main
          fi
